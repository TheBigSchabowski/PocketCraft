name: Build Linux Packages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'App-Version (optional, z. B. 1.4.3)'
        required: false

jobs:
  build-linux:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Temurin JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Linux packaging & runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fakeroot dpkg-dev xvfb xdg-utils desktop-file-utils libasound2t64 libxi6 libxrender1 libxtst6 libfreetype6 fontconfig file
          sudo mkdir -p /usr/share/desktop-directories /usr/share/applications

      - name: Determine version
        id: ver
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          elif [[ "${{ github.ref_name }}" == v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION=$(grep -E '^app\s*=' gradle/libs.versions.toml | head -n1 | cut -d'"' -f2)
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Using version: $VERSION"

      - name: Build .deb and distributable app image
        run: |
          chmod +x ./gradlew
          ./gradlew :desktop:packageDeb :desktop:createDistributable \
            -Dorg.gradle.java.home="$JAVA_HOME" \
            -Ppocketcraft.packagingJdk="$JAVA_HOME" \
            --no-daemon

      - name: Prepare dist artifacts
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          mkdir -p dist
          cp desktop/build/compose/binaries/main/deb/*.deb "dist/PocketCraft-${VERSION}-linux-amd64.deb"
          tar -czf "dist/PocketCraft-${VERSION}-linux-x86_64.tar.gz" -C desktop/build/compose/binaries/main/app PocketCraft
          ls -lh dist/

      - name: Smoke test .deb package
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          sudo dpkg -i "dist/PocketCraft-${VERSION}-linux-amd64.deb" || (sudo apt-get update && sudo apt-get -f install -y)
          file /opt/pocketcraft/bin/PocketCraft
          file /opt/pocketcraft/bin/PocketCraft | grep -q "x86-64"
          xvfb-run -a /opt/pocketcraft/bin/PocketCraft --version

      - name: Upload Linux packages
        uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: |
            dist/*.deb
            dist/*.tar.gz
          retention-days: 14
